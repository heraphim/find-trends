name: Refresh data

# Regenerates the static CSVs in public/data/ once a day. Runs Python ONLY on
# this schedule (and manual dispatch) — never on push, so ordinary code pushes
# stay fast.
on:
  schedule:
    # cron is always UTC. 22:00 UTC ≈ local midnight in Romania (EET, winter);
    # 01:00 local in summer (EEST). Adjust if you want a different local time.
    - cron: '0 22 * * *'
  workflow_dispatch: # "Run workflow" button in the Actions tab

# Needs write access to commit the refreshed CSVs back to main.
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/getting-data/requirements.txt
      - run: pip install -r scripts/getting-data/requirements.txt

      - name: Regenerate CSVs
        run: python scripts/getting-data/_generate_all.py

      - name: Publish CSVs to public/data (renamed to tab names)
        run: |
          cp scripts/getting-data/days.csv           public/data/days.csv
          cp scripts/getting-data/weather_brasov.csv public/data/brasov-weather.csv
          cp scripts/getting-data/weather_sibiu.csv  public/data/sibiu-weather.csv
          cp scripts/getting-data/commodities.csv    public/data/commodities.csv
          cp scripts/getting-data/eurron.csv         public/data/euro.csv

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "chore(data): daily refresh"
            git push
          fi
