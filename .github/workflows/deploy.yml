name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Redeploy after the daily data refresh commits new CSVs. (A push made by the
  # refresh workflow's GITHUB_TOKEN can't trigger this workflow directly, so we
  # chain off its completion instead.)
  workflow_run:
    workflows: ['Refresh data']
    types: [completed]
  workflow_dispatch: # allows manual runs from the Actions tab

# Permissions the GITHUB_TOKEN needs to publish Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deploy at a time; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip when the daily refresh failed; still run for push / manual dispatch.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
